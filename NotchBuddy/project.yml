name: NotchBuddy
options:
  bundleIdPrefix: fr.louisraille
  deploymentTarget:
    macOS: "15.0"
  xcodeVersion: "27.0"
  createIntermediateGroups: true
  developmentLanguage: en

settings:
  base:
    SWIFT_VERSION: "6.0"
    ENABLE_HARDENED_RUNTIME: YES
    CODE_SIGN_STYLE: Manual
    OTHER_SWIFT_FLAGS: "-strict-concurrency=complete"
  configs:
    Debug:
      CODE_SIGNING_REQUIRED: NO
      CODE_SIGNING_ALLOWED: NO
    Release:
      CODE_SIGNING_REQUIRED: YES
      CODE_SIGNING_ALLOWED: YES
      CODE_SIGN_IDENTITY: "Developer ID Application"
      DEVELOPMENT_TEAM: 256AUJ9555
      OTHER_CODE_SIGN_FLAGS: "--timestamp"
      CODE_SIGN_ENTITLEMENTS: Resources/Coucou.entitlements

schemes:
  NotchBuddy:
    build:
      targets:
        NotchBuddy: all
        NotchBuddyTests: [test]
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - NotchBuddyTests
    archive:
      config: Release
  CoucouAppStore:
    build:
      targets:
        CoucouAppStore: all
    run:
      config: Debug
    archive:
      config: Release

targets:
  NotchBuddy:
    type: application
    platform: macOS
    sources:
      - path: Sources
        type: group
      - path: Assets.xcassets
        buildPhase: resources
      - path: Resources/sounds
        buildPhase: resources
        type: folder
      - path: Resources/Localizable.xcstrings
        buildPhase: resources
      - path: Resources/InfoPlist.xcstrings
        buildPhase: resources
    info:
      path: Resources/Info.plist
      properties:
        CFBundleName: Coucou
        CFBundleDisplayName: Coucou
        CFBundleIdentifier: fr.louisraille.NotchBuddy
        CFBundleVersion: "2"
        CFBundleShortVersionString: "0.3.3"
        CFBundlePackageType: APPL
        CFBundleDevelopmentRegion: en
        CFBundleLocalizations: [en, es]
        LSUIElement: YES
        NSHighResolutionCapable: YES
        NSSupportsAutomaticGraphicsSwitching: YES
        NSAppleEventsUsageDescription: "To jump to your terminal and send emails."
        NSAccessibilityUsageDescription: "To read the active window and the file you're editing, and attach them as context."
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
        NSCalendarsFullAccessUsageDescription: "Do not disturb: Coucou stays quiet while you're in a calendar event."
        NSMicrophoneUsageDescription: "Push-to-talk: Mochi listens only while you hold the shortcut."
        NSSpeechRecognitionUsageDescription: "Push-to-talk: your voice is transcribed on this Mac to ask Mochi."
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: fr.louisraille.NotchBuddy
        PRODUCT_NAME: Coucou
        INFOPLIST_FILE: Resources/Info.plist
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        MACOSX_DEPLOYMENT_TARGET: "15.0"
        ENABLE_SANDBOX: NO

  CoucouAppStore:
    type: application
    platform: macOS
    sources:
      - path: Sources
        type: group
      - path: Assets.xcassets
        buildPhase: resources
      - path: Resources/sounds
        buildPhase: resources
        type: folder
      - path: Resources/Localizable.xcstrings
        buildPhase: resources
      - path: Resources/InfoPlist.xcstrings
        buildPhase: resources
    info:
      path: Resources/InfoAppStore.plist
      properties:
        CFBundleName: Coucou
        CFBundleDisplayName: Coucou
        CFBundleIdentifier: fr.louisraille.Coucou
        CFBundleVersion: "2"
        CFBundleShortVersionString: "1.0"
        CFBundlePackageType: APPL
        CFBundleDevelopmentRegion: en
        CFBundleLocalizations: [en, es]
        LSUIElement: YES
        NSHighResolutionCapable: YES
        NSSupportsAutomaticGraphicsSwitching: YES
        LSApplicationCategoryType: public.app-category.developer-tools
        ITSAppUsesNonExemptEncryption: NO
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
        NSCalendarsFullAccessUsageDescription: "Do not disturb: Coucou stays quiet while you're in a calendar event."
        NSMicrophoneUsageDescription: "Push-to-talk: Mochi listens only while you hold the shortcut."
        NSSpeechRecognitionUsageDescription: "Push-to-talk: your voice is transcribed on this Mac to ask Mochi."
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: fr.louisraille.Coucou
        PRODUCT_NAME: Coucou
        INFOPLIST_FILE: Resources/InfoAppStore.plist
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        MACOSX_DEPLOYMENT_TARGET: "15.0"
        CODE_SIGN_STYLE: Automatic
        CODE_SIGN_IDENTITY: "Apple Development"
        CODE_SIGN_ENTITLEMENTS: Resources/CoucouAppStore.entitlements
        DEVELOPMENT_TEAM: 256AUJ9555
        SWIFT_ACTIVE_COMPILATION_CONDITIONS: APPSTORE

  NotchBuddyTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - path: Tests
    dependencies:
      - target: NotchBuddy
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: fr.louisraille.NotchBuddyTests
        GENERATE_INFOPLIST_FILE: YES
        # The app's product is "Coucou", not the target name
        TEST_HOST: "$(BUILT_PRODUCTS_DIR)/Coucou.app/Contents/MacOS/Coucou"
        BUNDLE_LOADER: "$(TEST_HOST)"
        MACOSX_DEPLOYMENT_TARGET: "15.0"
