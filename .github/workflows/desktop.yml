name: Linux and Windows

# Every PR that touches the Tauri app: unit tests and a full build on Linux and
# Windows. The Linux packages are kept as artifacts so a PR can be tried without
# building it yourself. (Builds of main and releases: release.yml.)
on:
  pull_request:
    branches: [main]
    paths: ["windows/**", ".github/workflows/desktop.yml"]
  workflow_dispatch:

concurrency:
  group: desktop-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            name: linux
          - os: windows-latest
            name: windows
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    defaults:
      run:
        working-directory: windows
        shell: bash
    steps:
      - uses: actions/checkout@v4

      - name: Linux libraries (WebKitGTK, layer-shell, tray, keyring)
        if: matrix.name == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev libgtk-layer-shell-dev \
            libayatana-appindicator3-dev librsvg2-dev libdbus-1-dev libssl-dev patchelf rpm

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: windows/package-lock.json

      - uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            windows/target
          key: ${{ matrix.name }}-cargo-${{ hashFiles('windows/Cargo.lock', 'windows/**/Cargo.toml') }}
          restore-keys: ${{ matrix.name }}-cargo-

      - run: npm ci

      - name: Type check the front end
        run: npx tsc --noEmit

      # The front end must exist before the app crate compiles (tauri embeds it).
      - name: Unit tests
        run: |
          npm run build
          cargo test --workspace

      - name: Build the app and its packages
        run: npx tauri build

      - name: Keep the Linux packages
        if: matrix.name == 'linux'
        uses: actions/upload-artifact@v4
        with:
          name: Coucou-Linux
          path: |
            windows/target/release/bundle/deb/*.deb
            windows/target/release/bundle/rpm/*.rpm
            windows/target/release/bundle/appimage/*.AppImage

      # New dependencies (Linux) are resolved here: keep the lock file so it can be committed.
      - name: Keep Cargo.lock
        uses: actions/upload-artifact@v4
        with:
          name: Cargo.lock-${{ matrix.name }}
          path: windows/Cargo.lock
