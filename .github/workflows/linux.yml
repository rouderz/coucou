name: Linux release

# Tags like `linux-v0.1.1`: builds the .deb, .rpm and .AppImage and publishes them
# as a release (never marked "Latest", which belongs to the macOS releases).
on:
  push:
    tags: ['linux-v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-22.04   # oldest supported glibc, so the AppImage runs on more systems
    timeout-minutes: 45
    defaults:
      run:
        working-directory: windows
    steps:
      - uses: actions/checkout@v4

      - name: Linux libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev libgtk-layer-shell-dev \
            libayatana-appindicator3-dev librsvg2-dev libdbus-1-dev libssl-dev patchelf rpm

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: windows/package-lock.json

      - uses: dtolnay/rust-toolchain@stable

      - run: npm ci

      - name: Build the packages
        run: npx tauri build

      - name: Publish the release
        if: startsWith(github.ref, 'refs/tags/linux-v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          V="${GITHUB_REF_NAME#linux-v}"
          shopt -s nullglob
          files=(target/release/bundle/deb/*.deb target/release/bundle/rpm/*.rpm target/release/bundle/appimage/*.AppImage)
          gh release create "$GITHUB_REF_NAME" "${files[@]}" \
            --title "Coucou for Linux $V" --latest=false \
            --notes "Coucou for Linux $V. Debian/Ubuntu: the .deb. Fedora/openSUSE: the .rpm. Anything else: the .AppImage (chmod +x, then run it)."
