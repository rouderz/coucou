name: Release

# One pipeline for every platform:
#
#   a tag like v0.3.0 (bash scripts/release.sh 0.3.0 makes it) → builds macOS
#   (.dmg), Windows (setup .exe) and Linux (.deb, .rpm, .AppImage — x86_64 and
#   arm64) and publishes them together as the GitHub release v0.3.0. Coucou for
#   Mac's update check reads these releases (it picks the .dmg).
#
#   Nothing builds on merges to main. To try a build without releasing, run this
#   workflow by hand (Actions → Release → Run workflow): it keeps the files as
#   artifacts on the run for 14 days and publishes nothing.
#
# Nothing is code-signed yet (#38, #39): macOS asks to "Open Anyway" in Privacy &
# Security the first time, Windows SmartScreen asks for "More info → Run anyway".
# Set the repository variable PUBLISH_WINDOWS to "false" to leave the Windows
# installer out of releases (Defender once flagged the unsigned one by mistake).
on:
  push:
    tags: ['v*']
  # Test builds: Actions → Release → Run workflow (pick any branch, e.g. a PR's),
  # or `gh workflow run release.yml --ref <branch> -f platforms=linux`.
  workflow_dispatch:
    inputs:
      platforms:
        description: Which builds
        type: choice
        options: [all, macos, windows, linux]
        default: all

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

jobs:
  version:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.v.outputs.version }}
      label: ${{ steps.v.outputs.label }}
      release: ${{ steps.v.outputs.release }}
    steps:
      - uses: actions/checkout@v4
      - id: v
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            V="${GITHUB_REF_NAME#v}"
            echo "release=true" >> "$GITHUB_OUTPUT"
            echo "label=$V" >> "$GITHUB_OUTPUT"
          else
            V=$(awk -F'"' '/CFBundleShortVersionString/ {print $2; exit}' NotchBuddy/project.yml)
            echo "release=false" >> "$GITHUB_OUTPUT"
            echo "label=$V-${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"
          fi
          echo "version=$V" >> "$GITHUB_OUTPUT"

      - name: Every platform carries the tag's version
        if: steps.v.outputs.release == 'true'
        run: bash scripts/versions.sh check "${{ steps.v.outputs.version }}"

  macos:
    needs: version
    if: github.event_name != 'workflow_dispatch' || contains(fromJSON('["all","macos"]'), inputs.platforms)
    runs-on: macos-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # make-dmg.sh numbers the build with the commit count
      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable
      - run: brew install xcodegen
      - name: Build the DMG
        run: |
          bash scripts/make-dmg.sh "${{ needs.version.outputs.version }}"
          mkdir -p out
          mv "dist/Coucou-${{ needs.version.outputs.version }}.dmg" "out/Coucou-${{ needs.version.outputs.label }}-macOS.dmg"
      - uses: actions/upload-artifact@v4
        with:
          name: Coucou-macOS
          path: out/*
          retention-days: 14

  windows:
    needs: version
    if: github.event_name != 'workflow_dispatch' || contains(fromJSON('["all","windows"]'), inputs.platforms)
    runs-on: windows-latest
    timeout-minutes: 45
    defaults:
      run:
        working-directory: windows
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: windows/package-lock.json
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            windows/target
          key: release-windows-${{ hashFiles('windows/Cargo.lock', 'windows/**/Cargo.toml') }}
          restore-keys: release-windows-
      - run: npm ci
      - name: Build the installer
        run: |
          npx tauri build
          mkdir -p ../out
          cp target/release/bundle/nsis/*-setup.exe "../out/Coucou-${{ needs.version.outputs.label }}-Windows-setup.exe"
      - uses: actions/upload-artifact@v4
        with:
          name: Coucou-Windows
          path: out/*
          retention-days: 14

  linux:
    needs: version
    if: github.event_name != 'workflow_dispatch' || contains(fromJSON('["all","linux"]'), inputs.platforms)
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-22.04       # oldest supported glibc: the AppImage runs on more systems
            arch: x86_64
          - runner: ubuntu-22.04-arm
            arch: arm64
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    defaults:
      run:
        working-directory: windows
    steps:
      - uses: actions/checkout@v4
      - name: Linux libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev libgtk-layer-shell-dev \
            libayatana-appindicator3-dev librsvg2-dev libdbus-1-dev libssl-dev patchelf rpm
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: windows/package-lock.json
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            windows/target
          key: release-linux-${{ matrix.arch }}-${{ hashFiles('windows/Cargo.lock', 'windows/**/Cargo.toml') }}
          restore-keys: release-linux-${{ matrix.arch }}-
      - run: npm ci
      - name: Build the packages
        run: |
          npx tauri build
          L="${{ needs.version.outputs.label }}"
          mkdir -p ../out
          shopt -s nullglob
          for f in target/release/bundle/deb/*.deb; do cp "$f" "../out/Coucou-$L-Linux-${{ matrix.arch }}.deb"; done
          for f in target/release/bundle/rpm/*.rpm; do cp "$f" "../out/Coucou-$L-Linux-${{ matrix.arch }}.rpm"; done
          for f in target/release/bundle/appimage/*.AppImage; do cp "$f" "../out/Coucou-$L-Linux-${{ matrix.arch }}.AppImage"; done
          ls -la ../out
      - uses: actions/upload-artifact@v4
        with:
          name: Coucou-Linux-${{ matrix.arch }}
          path: out/*
          retention-days: 14

  publish:
    needs: [version, macos, windows, linux]
    if: needs.version.outputs.release == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/download-artifact@v4
        with:
          path: out
          merge-multiple: true
      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
          PUBLISH_WINDOWS: ${{ vars.PUBLISH_WINDOWS }}
        run: |
          V="${{ needs.version.outputs.version }}"
          [ "$PUBLISH_WINDOWS" = "false" ] && rm -f out/*Windows*
          ls -la out
          cat > notes.md <<NOTES
          ## Downloads

          | | |
          |---|---|
          | **macOS** | \`Coucou-$V-macOS.dmg\` — open it and drag Coucou to Applications. The first time, macOS asks: System Settings → Privacy & Security → **Open Anyway**. |
          | **Windows** | \`Coucou-$V-Windows-setup.exe\` — not code-signed yet: SmartScreen → **More info → Run anyway**. |
          | **Linux** | \`.deb\` (Debian, Ubuntu), \`.rpm\` (Fedora, openSUSE) or \`.AppImage\` (anything else: \`chmod +x\`, then run it). x86_64 and arm64. |

          NOTES
          gh release view "v$V" >/dev/null 2>&1 || gh release create "v$V" \
            --title "Coucou $V" --notes-file notes.md --generate-notes \
            --notes-start-tag "$(git describe --tags --abbrev=0 "v$V^" 2>/dev/null || true)"
          gh release upload "v$V" out/* --clobber
