name: Release

# Push a tag like v0.2.0 (scripts/release.sh 0.2.0 does it): GitHub builds Coucou, packages
# the DMG and publishes it as a release on this repo. Coucou's update check reads these releases.
#
# Without a Developer ID certificate in the secrets the app is ad-hoc signed: on another Mac the
# first launch needs right-click → Open. (Signing + notarization: issue #38.)
on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      version:
        description: Version to build (e.g. 0.2.0), without the v
        required: true

permissions:
  contents: write

jobs:
  dmg:
    runs-on: macos-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # make-dmg.sh numbers the build with the commit count

      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Version
        id: v
        run: |
          V="${{ github.event.inputs.version }}"
          [ -z "$V" ] && V="${GITHUB_REF_NAME#v}"
          echo "version=$V" >> "$GITHUB_OUTPUT"

      - name: Build the DMG
        run: bash scripts/make-dmg.sh "${{ steps.v.outputs.version }}"

      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          V="${{ steps.v.outputs.version }}"
          gh release view "v$V" >/dev/null 2>&1 || gh release create "v$V" \
            --title "Coucou $V" --generate-notes \
            --notes-start-tag "$(git describe --tags --abbrev=0 "v$V^" 2>/dev/null || true)" || true
          gh release upload "v$V" "dist/Coucou-$V.dmg" --clobber
